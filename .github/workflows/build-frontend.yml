name: Build frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$before^{commit}" 2>/dev/null || git fetch --depth=1 origin "$before"
          ver() { git show "$1:frontend/package.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])"; }
          now=$(ver HEAD)
          if ! prev=$(ver "$before"); then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$now" != "$prev" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: build-frontend
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Check
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        run: npm run build:dist

      - name: Commit Assets/app/dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Assets/app/dist
          if git diff --cached --quiet; then
            echo "build output unchanged"
            exit 0
          fi
          git commit -m "build: update Assets/app/dist from ${GITHUB_SHA::7}"
          git push
